name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp av numpy pillow
      - run: python -X utf8 tests/test_client.py
      - run: python -X utf8 tests/test_manager.py
      - name: standalone manager starts
        if: runner.os != 'Windows'
        run: |
          sh tools/start_manager.sh --no-window --port 18999 &
          sleep 5
          curl -fsS http://127.0.0.1:18999/relay_api/manager/ > /dev/null
          kill %1
